name: Session sync

# Runs every 5 minutes, all year. Most ticks are a single cheap DB query that
# exits immediately ("nothing pending") — Playwright is only installed and
# launched on the rare tick where a session is actually in its polling
# window (see server/lib/sync/sessionWindows.js). Free on a public repo, so
# there's no cost pressure to narrow this further.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - id: check
        name: Check for a session in its polling window
        run: node scripts/check-active-sessions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Chromium
        if: steps.check.outputs.active == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape and insert pending sessions
        if: steps.check.outputs.active == 'true'
        run: node scripts/sync-active-sessions.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
