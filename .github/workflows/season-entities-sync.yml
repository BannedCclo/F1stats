name: Season entities sync

# Runs once a day. Onboards new drivers, teams, and circuits for the
# current and next season from f1api.dev (GET /{year}/drivers,
# /{year}/circuits, plus the calendar and standings) — the thing
# session-sync.yml deliberately doesn't do, since it only scrapes results
# for entities that already exist in the database. No browser needed here
# (plain f1api.dev fetches), so unlike session-sync there's no Playwright
# install step.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Sync new drivers, teams, and circuits
        run: npm run sync:season
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
